  const fmt=plat==="tiktok"?"Guion hablado TikTok coloquial max 160 palabras sin hashtags.":"Caption Instagram con emojis y 4-5 hashtags max 200 palabras.";

  const nicheCtx=sel.map(id=>NICHES.find(n=>n.id===id)?.ctx).filter(Boolean).join(" Además: ");

          <span style={{fontSize:20}}>{o.e}</span><div style={{color:exp===o.id?OG:"#fff",fontWeight:exp===o.id?700:500,fontSize:13}}>{o.l}</div>{exp===o.id&&<span style={{marginLeft:"auto",color:OG}}>✓</span>}

}

// ─── Day Screen ───────────────────────────────────────────────────────────────
function DayScreen({user,leader,day,progress,nb,profile,onBack,onSave}){
  const tasks=TASKS(nb);
  const sv=progress[day]||{};
  const [chk,setChk]=useState(sv.checked||[]);
  const [rout,setRout]=useState(sv.routines||[]);
  const [proofs,setProofs]=useState(sv.proofs||{});
  const [tchk,setTchk]=useState(sv.teamChecked||[]);
  const [tproofs,setTproofs]=useState(sv.teamProofs||{});
  const [alt,setAlt]=useState({});
  const [motiv,setMotiv]=useState(false);
  const [blocker,setBlocker]=useState(false);
  const [tab,setTab]=useState("tasks");
  const [saving,setSaving]=useState(false);

  const pct=Math.round((chk.length/tasks.length)*100);
  const allDone=chk.length===tasks.length;
  const m=MOTIV[day%MOTIV.length];

  const persist=async(c,r,p,tc,tp)=>{setSaving(true);await saveDay(user,leader.id,day,{checked:c,routines:r,proofs:p,teamChecked:tc,teamProofs:tp});onSave();setSaving(false);};
  const togTask=id=>{const n=chk.includes(id)?chk.filter(x=>x!==id):[...chk,id];setChk(n);persist(n,rout,proofs,tchk,tproofs);};
  const togRout=id=>{const n=rout.includes(id)?rout.filter(x=>x!==id):[...rout,id];setRout(n);persist(chk,n,proofs,tchk,tproofs);};
  const saveP=(id,v)=>{const n={...proofs,[id]:v};setProofs(n);persist(chk,rout,n,tchk,tproofs);};
  const togTeam=id=>{const n=tchk.includes(id)?tchk.filter(x=>x!==id):[...tchk,id];setTchk(n);persist(chk,rout,proofs,n,tproofs);};
  const saveTP=(id,v)=>{const n={...tproofs,[id]:v};setTproofs(n);persist(chk,rout,proofs,tchk,n);};

  return <div style={{minHeight:"100vh",background:CR}}>

    {/* Header */}

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <button onClick={onBack} style={{background:"rgba(255,255,255,.12)",border:"none",color:"#fff",borderRadius:16,padding:"5px 12px",fontSize:12,cursor:"pointer"}}>← Volver</button>
          {saving&&<span style={{fontSize:11,color:"rgba(255,255,255,.4)"}}>☁️ Guardando...</span>}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"start"}}>
          <div><div style={{fontSize:10,color:OG,letterSpacing:3,textTransform:"uppercase",marginBottom:2}}>Día {day} · {user}</div><div style={{fontSize:20,fontWeight:700}}>Tu rutina de hoy</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:26,fontWeight:700,color:allDone?SF:OG}}>{pct}%</div><div style={{fontSize:10,color:"rgba(255,255,255,.45)"}}>{chk.length}/{tasks.length}</div></div>
        </div>
        <div style={{height:4,background:"rgba(255,255,255,.12)",borderRadius:4,marginTop:12,overflow:"hidden"}}><div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,"+OG+","+SF+")",borderRadius:4,transition:"width .4s"}}/></div>
      </div>
    </div>
    {/* Quick actions */}
    <div style={{background:"#fff",borderBottom:"1px solid rgba(0,0,0,.06)",padding:"8px 16px"}}>
      <div style={{maxWidth:620,margin:"0 auto",display:"flex",gap:8,overflowX:"auto"}}>
        <button onClick={()=>setMotiv(true)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:18,border:"1.5px solid "+OG,background:"rgba(201,168,76,.07)",color:DK,fontSize:11,cursor:"pointer"}}>🔥 Motivación</button>
        <button onClick={()=>setBlocker(true)} style={{whiteSpace:"nowrap",padding:"6px 12px",borderRadius:18,border:"1.5px solid rgba(107,79,160,.3)",background:"rgba(107,79,160,.06)",color:DK,fontSize:11,cursor:"pointer"}}>🧠 Tengo un bloqueo</button>

            </div>

          {t.alt&&!done&&<button onClick={()=>setAlt(s=>({...s,[t.id]:!s[t.id]}))} style={{marginTop:8,fontSize:11,color:OG,background:"rgba(201,168,76,.1)",border:"1px solid rgba(201,168,76,.3)",borderRadius:7,padding:"4px 10px",cursor:"pointer"}}>{useAlt?"← Tarea original":"🔄 Soy nueva, ver alternativa"}</button>}
          {!done&&t.proof!=="none"&&<div style={{marginTop:10,background:"rgba(0,0,0,.03)",borderRadius:10,padding:12}}>
            <div style={{fontSize:10,color:"rgba(0,0,0,.4)",fontWeight:700,letterSpacing:.5,marginBottom:6}}>{t.proof==="link"?"🔗":"📝"} {t.pl}</div>
            <input defaultValue={proofs[t.id]||""} onChange={e=>saveP(t.id,e.target.value)} placeholder={t.proof==="link"?"https://...":"Escribe aquí..."} style={{width:"100%",padding:"8px 10px",borderRadius:8,border:"1.5px solid rgba(0,0,0,.1)",fontSize:12,outline:"none",boxSizing:"border-box"}}/>
          </div>}
          {done&&proofs[t.id]&&<div style={{marginTop:7,fontSize:11,color:SF,background:"rgba(82,183,136,.08)",borderRadius:7,padding:"5px 10px"}}>✅ Prueba guardada ☁️</div>}
        </div>;})}
        {allDone&&<div style={{background:"linear-gradient(135deg,"+G+","+SF+")",borderRadius:18,padding:22,textAlign:"center",color:"#fff",marginTop:6}}><div style={{fontSize:40,marginBottom:8}}>🏆</div><div style={{fontSize:18,fontWeight:700,marginBottom:4}}>¡Día {day} completado!</div><div style={{fontSize:13,opacity:.9}}>El día {day+1} ya está desbloqueado. Eres imparable.</div></div>}
      </div>}
      {tab==="routines"&&<div>
        <div style={{background:"rgba(45,106,79,.06)",borderRadius:14,padding:14,marginBottom:16,border:"1px solid rgba(45,106,79,.12)"}}><div style={{fontSize:13,color:G,fontWeight:700,marginBottom:4}}>🌱 Hábitos que construyen el negocio</div><div style={{fontSize:12,color:"rgba(0,0,0,.5)",lineHeight:1.6}}>Pequeñas rutinas que separan a las que tienen resultados de las que siguen esperándolos.</div></div>
        {ROUTINES.map(r=>{const done=rout.includes(r.id);return <div key={r.id} onClick={()=>togRout(r.id)} style={{display:"flex",alignItems:"center",gap:12,background:done?"rgba(82,183,136,.08)":"#fff",borderRadius:14,padding:"14px 16px",marginBottom:9,cursor:"pointer",border:done?"1.5px solid "+SF:"1.5px solid rgba(0,0,0,.08)"}}>
          <div style={{width:24,height:24,borderRadius:7,border:done?"none":"2px solid rgba(0,0,0,.15)",background:done?SF:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{done&&<span style={{color:"#fff",fontSize:12,fontWeight:700}}>✓</span>}</div>
          <div style={{fontSize:13,color:done?G:DK,textDecoration:done?"line-through":"none",lineHeight:1.5}}>{r.icon} {r.l}</div>
        </div>;})}
        <div style={{background:"linear-gradient(135deg,"+DK+"ee,"+G+"cc)",borderRadius:18,padding:22,marginTop:18,color:"#fff",textAlign:"center"}}><div style={{fontSize:22,marginBottom:10}}>💬</div><div style={{fontSize:15,fontWeight:700,color:OG,marginBottom:8,lineHeight:1.4}}>{m.t}</div><div style={{fontSize:12,opacity:.85,lineHeight:1.7}}>{m.b}</div></div>
        {[{p:"📸 Instagram",c:"#e1306c",tips:["Publica en feed 4-5x/semana. Los Reels tienen 3x más alcance.","Stories diarias mantienen tu presencia aunque no publiques en feed.","Usa 3-5 hashtags específicos, no los más populares.","La primera hora tras publicar es crucial: responde comentarios.","Los 'guardados' pesan más que los likes para el algoritmo."]},{p:"🎵 TikTok",c:"#000",tips:["El algoritmo premia la retención: los 3 primeros segundos son clave.","Publica 1-3 veces al día. La consistencia es clave.","Responde comentarios con vídeos: favorito del algoritmo.","3 hashtags generales + 2 de nicho.","No borres vídeos con pocos views: pueden viralizarse después."]}].map(sec=><div key={sec.p} style={{background:"#fff",borderRadius:14,padding:16,marginTop:14,border:"1px solid rgba(0,0,0,.07)"}}><div style={{fontSize:14,fontWeight:700,color:sec.c,marginBottom:10}}>{sec.p}</div>{sec.tips.map((tip,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:7}}><span style={{color:OG,fontWeight:700,flexShrink:0,fontSize:12}}>{i+1}.</span><span style={{fontSize:12,color:"rgba(0,0,0,.6)",lineHeight:1.6}}>{tip}</span></div>)}</div>)}

// ─── Dashboard ────────────────────────────────────────────────────────────────
function Dashboard({user,leader,nb,profile,progress,onDay,onEdit,onLogout}){
  const TOTAL=6;
  const getS=d=>{const p=progress[d];if(!p)return"locked";if((p.checked||[]).length===TOTAL)return"done";if((p.checked||[]).length>0)return"partial";return"unlocked";};
  const getMax=()=>{let m=1;for(let d=1;d<=30;d++){if((progress[d]?.checked||[]).length===TOTAL)m=d+1;else break;}return Math.min(m,30);};
  const max=getMax();
  const comp=Object.values(progress).filter(p=>(p?.checked||[]).length===TOTAL).length;
  const sel=(profile?.niches||[profile?.niche]).filter(Boolean).map(id=>NICHES.find(n=>n.id===id)).filter(Boolean);
  return <div style={{minHeight:"100vh",background:CR}}>
    <div style={{background:"linear-gradient(135deg,"+DK+",#16213e,"+G+")",padding:"26px 20px 20px",color:"#fff"}}>
      <div style={{maxWidth:600,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"start",marginBottom:4}}>
          <div>
            <div style={{fontSize:10,color:leader.color,letterSpacing:3,textTransform:"uppercase",marginBottom:2}}>{leader.emoji} Equipo {leader.name}</div>
            <div style={{fontSize:22,fontWeight:700}}>Hola, {user} 👋</div>
            {sel.length>0&&<div style={{fontSize:11,color:"rgba(255,255,255,.45)",marginTop:2}}>{sel.map(n=>n.emoji).join("")} {sel.map(n=>n.label).join(" + ")}</div>}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:5,alignItems:"flex-end"}}>
            <button onClick={onLogout} style={{background:"rgba(255,255,255,.1)",border:"none",color:"rgba(255,255,255,.55)",borderRadius:9,padding:"5px 11px",fontSize:11,cursor:"pointer"}}>Salir</button>
            {profile&&<button onClick={onEdit} style={{background:"rgba(201,168,76,.15)",border:"none",color:OG,borderRadius:9,padding:"5px 11px",fontSize:10,cursor:"pointer"}}>✏️ Mi perfil</button>}
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:9,marginTop:16}}>
          {[{l:"Días completos",v:comp,i:"🏆"},{l:"Día actual",v:max,i:"📅"},{l:"% completado",v:Math.round((comp/30)*100)+"%",i:"📈"}].map((s,i)=><div key={i} style={{background:"rgba(255,255,255,.08)",borderRadius:12,padding:"12px 8px",textAlign:"center",border:"1px solid rgba(255,255,255,.08)"}}><div style={{fontSize:16}}>{s.i}</div><div style={{fontSize:18,fontWeight:700,color:OG,margin:"3px 0 1px"}}>{s.v}</div><div style={{fontSize:9,color:"rgba(255,255,255,.4)",letterSpacing:.5}}>{s.l.toUpperCase()}</div></div>)}
        </div>
      </div>
    </div>
    <div style={{padding:16,maxWidth:600,margin:"0 auto"}}>
      <div onClick={()=>onDay(max)} style={{background:"linear-gradient(135deg,rgba(201,168,76,.2),"+LG+")",borderRadius:18,padding:18,marginBottom:20,border:"2px solid rgba(201,168,76,.44)",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div><div style={{fontSize:10,color:OG,fontWeight:700,letterSpacing:2,marginBottom:3}}>HOY · DÍA {max}</div><div style={{fontSize:17,fontWeight:700,color:DK}}>Empezar mis tareas</div><div style={{fontSize:11,color:"rgba(0,0,0,.4)",marginTop:2}}>{(progress[max]?.checked||[]).length>0?(progress[max].checked.length)+"/6 completadas · continúa":"Pulsa para empezar el día"}</div></div>
        <span style={{fontSize:24}}>→</span>
      </div>
      <div style={{fontSize:11,color:"rgba(0,0,0,.35)",fontWeight:700,letterSpacing:1,textTransform:"uppercase",marginBottom:12}}>Plan 30 días</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:7}}>
        {Array.from({length:30},(_,i)=>i+1).map(d=>{
          const st=d<=max?getS(d):"locked",isT=d===max;
          const bg={done:"linear-gradient(135deg,"+G+","+SF+")",partial:LG,unlocked:isT?"rgba(201,168,76,.12)":"#fff",locked:"rgba(0,0,0,.03)"}[st];
          const bd={done:"none",partial:"2px solid "+OG,unlocked:isT?"2px solid "+OG:"1.5px solid rgba(0,0,0,.1)",locked:"1.5px dashed rgba(0,0,0,.08)"}[st];
          const cl={done:"#fff",partial:DK,unlocked:DK,locked:"rgba(0,0,0,.18)"}[st];
          return <button key={d} onClick={()=>st!=="locked"&&onDay(d)} disabled={st==="locked"} style={{aspectRatio:"1",borderRadius:10,border:bd,background:bg,color:cl,fontSize:st==="done"?14:12,fontWeight:700,cursor:st!=="locked"?"pointer":"not-allowed",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1}}>
            <span>{st==="done"?"✅":st==="locked"?"🔒":d}</span>
            {st==="partial"&&<span style={{fontSize:7,opacity:.7}}>{(progress[d]?.checked||[]).length}/6</span>}
          </button>;
        })}
      </div>
    </div>
  </div>;
}

// ─── Root App ─────────────────────────────────────────────────────────────────
function App(){
  const [leader,setLeader]=useState(null);
  const [user,setUser]=useState(null);
  const [nb,setNb]=useState(false);
  const [profile,setProfile]=useState(null);
  const [progress,setProgress]=useState({});
  const [loading,setLoading]=useState(false);
  const [day,setDay]=useState(null);
  const [onboard,setOnboard]=useState(false);

  // Restore session on load
  useEffect(()=>{
    try{
      const s=localStorage.getItem("art:session");
      if(!s)return;
      const {lid,lname,lemoji,lcolor,uname,newbie}=JSON.parse(s);
      if(!lid||!uname)return;
      const l={id:lid,name:lname,emoji:lemoji||"🌿",color:lcolor||OG};
      setLeader(l);setUser(uname);setNb(!!newbie);setLoading(true);
      Promise.all([loadDays(uname,lid),loadProf(uname,lid)]).then(([p,pr])=>{
        setProgress(p||{});setProfile(pr||null);
        if(!pr)setOnboard(true);
      }).catch(()=>{}).finally(()=>setLoading(false));
    }catch{setLoading(false);}
  },[]);

  const login=async(name,newbie)=>{
    setLoading(true);setUser(name);setNb(newbie);
    localStorage.setItem("art:session",JSON.stringify({lid:leader.id,lname:leader.name,lemoji:leader.emoji,lcolor:leader.color,uname:name,newbie}));
    const [p,pr]=await Promise.all([loadDays(name,leader.id),loadProf(name,leader.id)]);
    setProgress(p||{});setProfile(pr||null);
    if(!pr)setOnboard(true);
    setLoading(false);
  };

  const logout=()=>{localStorage.removeItem("art:session");setLeader(null);setUser(null);setProfile(null);setProgress({});setDay(null);setOnboard(false);};
  const refresh=async()=>{if(user&&leader){const p=await loadDays(user,leader.id);setProgress(p||{});}};
  const back=async()=>{await refresh();setDay(null);};

  if(loading)return <div style={{minHeight:"100vh",background:DK,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12,color:OG,fontSize:16}}><div style={{fontSize:36}}>🌿</div><div>Cargando... ☁️</div></div>;
  if(!leader)return <LeaderSelect onSelect={setLeader}/>;
  if(!user)return <LoginScreen leader={leader} onLogin={login} onBack={()=>setLeader(null)}/>;
  if(onboard)return <Onboarding user={user} leader={leader} onDone={pr=>{setProfile(pr);setOnboard(false);}}/>;
  if(day)return <DayScreen user={user} leader={leader} day={day} progress={progress} nb={nb} profile={profile} onBack={back} onSave={refresh}/>;
  return <Dashboard user={user} leader={leader} nb={nb} profile={profile} progress={progress} onDay={setDay} onEdit={()=>setOnboard(true)} onLogout={logout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
